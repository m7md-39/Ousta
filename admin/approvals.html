<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مراجعة الفنيين | Ousta | أُسطى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/login.css">
</head>
<body data-role="admin" data-view="approvals" data-root="../">

<div id="appRoot">
  <div class="topbar">
    <a class="brand brand--logo" href="dashboard.html" aria-label="Ousta | أُسطى — الصفحة الرئيسية">
      <img class="brand-logo" src="../assets/logo.png" width="881" height="535" alt="Ousta | أُسطى">
    </a>
    <div class="topbar-right">
      <div class="bell-wrap">
        <button class="bell-btn" id="bellBtn" aria-label="الإشعارات"><i class="fa-solid fa-bell"></i><span class="bell-dot" id="bellDot" style="display:none">0</span></button>
      </div>
      <button class="bell-btn logout-btn" id="logoutBtn" onclick="logout()" aria-label="تسجيل الخروج" title="تسجيل الخروج"><i class="fa-solid fa-right-from-bracket"></i></button>
      <div class="profile-wrap">
        <button class="profile-btn" id="profileBtn" onclick="toggleProfileMenu()">
          <span class="profile-ic" id="profileIc"><i class="fa-solid fa-user"></i></span>
          <span class="profile-name" id="profileName">حسابي</span>
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="profile-menu" id="profileMenu" style="display:none;">
          <button onclick="goProfileFromMenu()"><i class="fa-solid fa-id-card"></i>الملف الشخصي</button>
          <button onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>تسجيل الخروج</button>
        </div>
      </div>
    </div>
  </div>

  <div class="shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script src="../js/data/services.js"></script>
<script src="../js/data/technicians.js"></script>
<script src="../js/data/constants.js"></script>
<script src="../js/state.js"></script>
<script src="../js/utils/helpers.js"></script>
<script src="../js/components/problem-photos.js"></script>
<script src="../js/components/topbar.js"></script>
<script src="../js/components/notifications.js"></script>
<script src="../js/pages/admin/index.js"></script>
<script src="../js/pages/admin/dashboard.js"></script>
<script src="../js/pages/admin/users.js"></script>
<script src="../js/pages/admin/approvals.js"></script>
<script src="../js/pages/admin/services.js"></script>
<script src="../js/pages/admin/monitor.js"></script>
<script src="../js/pages/admin/complaints.js"></script>
<script src="../js/pages/admin/broadcast.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
