<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>
<body class="login-mode">

<!-- Login screen (shown until a session exists) -->
<div id="loginRoot" class="login-screen">
  <main class="login-card">
    <header class="login-head">
      <div class="login-logo"><img src="assets/logo.png" width="881" height="535" alt="Ousta | أُسطى"></div>
      <h1>تسجيل الدخول</h1>
      <p>أهلاً بعودتك، سجّل دخولك للمتابعة</p>
    </header>
    <form class="login-form" id="loginForm" novalidate autocomplete="on">
      <div class="lf-field" id="lfIdField">
        <label for="lfId">البريد الإلكتروني أو اسم المستخدم</label>
        <div class="lf-input">
          <i class="fa-solid fa-user lf-ic" aria-hidden="true"></i>
          <input id="lfId" name="username" type="text" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="name@example.com" aria-describedby="lfIdErr">
        </div>
        <div class="lf-err" id="lfIdErr" role="alert"></div>
      </div>
      <div class="lf-field" id="lfPwField">
        <label for="lfPw">كلمة المرور</label>
        <div class="lf-input">
          <i class="fa-solid fa-lock lf-ic" aria-hidden="true"></i>
          <input id="lfPw" name="password" type="password" autocomplete="current-password" placeholder="••••••••" aria-describedby="lfPwErr">
          <button type="button" class="lf-eye" id="lfEye" aria-label="إظهار كلمة المرور" aria-pressed="false"><i class="fa-solid fa-eye"></i></button>
        </div>
        <div class="lf-err" id="lfPwErr" role="alert"></div>
      </div>
      <button type="submit" class="lf-submit" id="lfSubmit"><span>دخول</span><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
      <div class="lf-demo">
        <span class="lf-demo-tag">حسابات تجريبية</span>
        <button type="button" class="lf-chip" data-demo="customer">عميل</button>
        <button type="button" class="lf-chip" data-demo="technician">أسطى</button>
        <button type="button" class="lf-chip" data-demo="admin">الإدارة</button>
      </div>
    </form>
    <p class="login-foot"><i class="fa-solid fa-circle-info" aria-hidden="true"></i> وضع تجريبي: التحقق يتم داخل المتصفح فقط ولا يوفّر أمانًا حقيقيًا.</p>
  </main>
</div>

<div id="appRoot">
  <div class="topbar">
    <a class="brand brand--logo" href="./" aria-label="Ousta | أُسطى — الصفحة الرئيسية">
      <img class="brand-logo" src="assets/logo.png" width="881" height="535" alt="Ousta | أُسطى">
    </a>
    <div class="topbar-right">
      <div class="bell-wrap">
        <button class="bell-btn" id="bellBtn" aria-label="الإشعارات"><i class="fa-solid fa-bell"></i><span class="bell-dot" id="bellDot" style="display:none">0</span></button>
      </div>
      <button class="bell-btn logout-btn" id="logoutBtn" onclick="logout()" aria-label="تسجيل الخروج" title="تسجيل الخروج"><i class="fa-solid fa-right-from-bracket"></i></button>
      <div class="profile-wrap">
        <button class="profile-btn" id="profileBtn" onclick="toggleProfileMenu()">
          <span class="profile-ic" id="profileIc"><i class="fa-solid fa-user"></i></span>
          <span class="profile-name" id="profileName">حسابي</span>
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <div class="profile-menu" id="profileMenu" style="display:none;">
          <button onclick="goProfileFromMenu()"><i class="fa-solid fa-id-card"></i>الملف الشخصي</button>
          <button onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>تسجيل الخروج</button>
        </div>
      </div>
    </div>
  </div>

  <div class="shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
